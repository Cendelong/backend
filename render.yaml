# Render 部署配置（v6.6 动态多后端流量调度版）
#
# 【多后端部署】
# Render 免费版每月仅 5GB 出站流量，使用多个实例分摊。
# 后端数量不限，代理池组和API操作组可自由增删。
#
# 部署步骤：
#   1. 将 backend/ 目录推送到 GitHub 仓库
#   2. Render → New → Web Service → 连接该仓库（重复创建多个服务）
#   3. 每个服务设置不同的 name 和 BACKEND_ROLE 环境变量
#   4. Build Command: npm install
#   5. Start Command: npm start
#   6. 所有服务设置相同的 FRONTEND_URL
#   7. 部署完成后在前端系统设置页填入各后端地址
#
# 注意：render.yaml 只能定义一个服务，多后端需在 Render 面板逐个创建。

services:
  - type: web
    name: bili-backend-1
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # ★ 前端域名白名单（CORS）—— 所有后端都设相同值
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # ★ v6.6 后端角色：proxy=仅代理池 / api=仅API操作 / both=全部（默认）
      - key: BACKEND_ROLE
        value: both
      # ★ v6.6 出站流量阈值（默认4.5GB，留0.5GB安全余量）
      - key: BANDWIDTH_THRESHOLD
        value: 4.5GB
      - key: RATE_LIMIT
        value: 120
      - key: ORDER_LIMIT
        value: 20
      - key: USE_PROXY_POOL
        value: "true"
      - key: ENABLE_BROWSER_LOGIN
        value: "false"
